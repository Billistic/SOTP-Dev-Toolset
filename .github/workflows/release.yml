name: Release desktop app

# Push a tag like v2.1.0 (after desktop/bump_version.py 2.1.0) and this builds the Windows app,
# signs it, compiles the Inno Setup installer and publishes a GitHub Release with
# SOTP-Dev-Env-Setup-<version>.exe + latest.json - which is what the in-app updater reads.
#
# Signing secrets (Settings -> Secrets and variables -> Actions):
#   SIGN_PFX_BASE64      base64 of your code-signing .pfx   (certutil -encode cert.pfx cert.b64)
#   SIGN_PFX_PASSWORD    its password
# Without them the release is built unsigned (the updater then refuses to install it unless
# SOTP_UPDATE_ALLOW_UNSIGNED=1 is set on the client - fine for testing, not for users).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r desktop/requirements-desktop.txt
          npm ci --prefix frontend

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $v = (Select-String -Path backend/app/version.py -Pattern '__version__ = "([^"]+)"').Matches.Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            Write-Error "tag ${{ github.ref_name }} does not match backend/app/version.py ($v)"; exit 1 }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Restore signing certificate
        if: ${{ secrets.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
        run: |
          New-Item -ItemType Directory -Force desktop/certs | Out-Null
          [IO.File]::WriteAllBytes("desktop/certs/release.pfx", [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          "SOTP_SIGN_PFX=$PWD/desktop/certs/release.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build, sign and package
        shell: pwsh
        env:
          SOTP_SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: python desktop/build.py --installer

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: SOTP Dev Env ${{ env.APP_VERSION }}
          body_path: ${{ github.workspace }}/desktop/dist/release-notes.md
          files: |
            desktop/dist/SOTP-Dev-Env-Setup-*.exe
            desktop/dist/latest.json
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
