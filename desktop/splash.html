<!doctype html>
<html><head><meta charset="utf-8"><title>SOTP Dev Env</title>
<style>
  :root { --bg: #0f0f0f; --tile: #161616; --fg: #f2f2f2; --accent: #3b8ee0; --muted: #8a8a8a; }
  html, body { margin: 0; height: 100%; background: var(--bg); font-family: "Segoe UI", system-ui, sans-serif; color: var(--fg); overflow: hidden; user-select: none; }
  body { display: grid; place-items: center; }
  /* the frameless launcher window is exactly the tile (380x300); a standalone preview shows it on a dark page */
  .tile { width: 380px; height: 300px; box-sizing: border-box; border-radius: 0;
    background: radial-gradient(120% 90% at 50% 20%, #232323 0%, var(--tile) 55%, var(--bg) 100%);
    border: 1px solid #2a2a2a; box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    display: grid; grid-template-rows: 1fr auto; place-items: center; padding: 26px 28px 22px; position: relative;
    animation: tileIn .45s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes tileIn { from { opacity: 0; transform: scale(.94) } to { opacity: 1; transform: none } }
  .emblem { position: relative; width: 132px; height: 132px; }

  .emblem svg { width: 100%; height: 100%; overflow: visible; }
  /* 1) trace the outline, 2) fill fades in, 3) slow breathing glow forever */
  .p { fill: var(--fg); fill-opacity: 0; stroke: var(--fg); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round;
       stroke-dasharray: 600; stroke-dashoffset: 600;
       animation: trace 1.3s cubic-bezier(.4,0,.2,1) forwards, fillIn .7s ease forwards;
       animation-delay: calc(.15s + var(--i) * .18s), calc(1.25s + var(--i) * .12s); }
  @keyframes trace { to { stroke-dashoffset: 0 } }
  @keyframes fillIn { to { fill-opacity: 1; stroke-opacity: 0 } }
  .emblem::after { content: ""; position: absolute; inset: -10px; border-radius: 50%;
    background: radial-gradient(circle, rgba(59,142,224,.26) 0%, rgba(59,142,224,0) 68%);
    opacity: 0; animation: breathe 2.8s ease-in-out 2.1s infinite; }
  .emblem svg { animation: bob 2.8s ease-in-out 2.1s infinite; }
  @keyframes breathe { 0%, 100% { opacity: .3; transform: scale(.96) } 50% { opacity: 1; transform: scale(1.04) } }
  @keyframes bob { 0%, 100% { transform: scale(1) } 50% { transform: scale(1.02) } }

  .status { display: grid; gap: 8px; justify-items: center; width: 100%; }
  .name { font-size: 12px; letter-spacing: .28em; text-transform: uppercase; color: var(--muted); }
  .msg { font-size: 12.5px; color: #c9c9c9; min-height: 16px; transition: opacity .25s; }
  .bar { width: 100%; height: 3px; border-radius: 2px; background: #262626; overflow: hidden; position: relative; }
  .bar > i { position: absolute; inset: 0; width: var(--w, 30%); border-radius: 2px; background: linear-gradient(90deg, #2c6fb5, var(--accent)); transition: width .5s cubic-bezier(.2,.8,.2,1); }
  .bar.indeterminate > i { width: 30%; animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%) } 100% { transform: translateX(340%) } }
  .version { position: absolute; right: 14px; bottom: 10px; font-size: 10.5px; color: #5a5a5a; font-family: Consolas, monospace; }
  .leaving .tile { animation: tileOut .35s cubic-bezier(.4,0,1,1) forwards; }
  @keyframes tileOut { to { opacity: 0; transform: scale(1.06) } }
</style></head>

    <div class="status">
      <div class="name">SOTP Dev Env</div>
      <div class="msg" id="msg">Starting</div>
      <div class="bar indeterminate" id="bar"><i></i></div>
    </div>
    <div class="version" id="version">__VERSION__</div>
  </div>
  <script>
    function setStatus(text, progress) {
      const msg = document.getElementById('msg'), bar = document.getElementById('bar');
      msg.style.opacity = 0; setTimeout(() => { msg.textContent = text; msg.style.opacity = 1 }, 150);
      if (progress == null) bar.classList.add('indeterminate');
      else { bar.classList.remove('indeterminate'); bar.style.setProperty('--w', Math.round(progress * 100) + '%') }
    }
    function leave() { document.body.classList.add('leaving') }
    function setVersion(v) { document.getElementById('version').textContent = v }
    // the launcher drives setStatus / leave; open the file with #demo to watch a staged timeline
    const demo = [[900, 'Starting backend', null], [2600, 'Backend ready', 0.45], [3600, 'Loading interface', 0.75], [4700, 'Opening', 1.0]];
    if (location.hash === '#demo') for (const [t, m, p] of demo) setTimeout(() => setStatus(m, p), t)
    if (document.getElementById('version').textContent.startsWith('__')) setVersion('preview')
  </script>
